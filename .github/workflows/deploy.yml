name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or whatever your default branch is

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create 404 page
        # This copies index.html to 404.html so refreshes work
        run: cp build/client/index.html build/client/404.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # React Router v7 outputs to build/client by default
          path: 'build/client/'

  deploy_site:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4